[package]
name = "kv_store"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid =  { version = "1.23.1", features = ["serde", "v4"] }
